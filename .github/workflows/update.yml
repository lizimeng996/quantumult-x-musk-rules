name: Update rules

on:
  schedule:
    - cron: "27 2 * * *"   # 每天 02:27 UTC（北京时间 10:27）
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and validate
        run: python3 scripts/build.py
      - name: Commit if changed
        run: |
          # ignore the date-only header change
          if git diff --quiet -I '^# UPDATED:' -- QuantumultX Loon; then
            echo "No rule changes."; git checkout -- QuantumultX Loon; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add QuantumultX Loon
          git commit -m "chore: update rules $(date -u +%F)"
          git push
